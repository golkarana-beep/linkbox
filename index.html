<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkbox | جعبه لینک</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <h1>🔗 لینک‌باکس</h1>
            <div class="header-actions">
                <button id="themeToggle" class="btn-icon" aria-label="تغییر تم">🌙</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- فرم افزودن لینک -->
        <section class="card form-section">
            <h2>افزودن لینک جدید</h2>
            <form id="linkForm">
                <div class="form-group">
                    <label for="titleInput">عنوان لینک *</label>
                    <input type="text" id="titleInput" required placeholder="مثال: گیت‌هاب">
                </div>
                <div class="form-group">
                    <label for="urlInput">آدرس (URL) *</label>
                    <input type="url" id="urlInput" required placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label for="descriptionInput">توضیحات</label>
                    <textarea id="descriptionInput" placeholder="توضیحات کوتاه..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="categorySelect">انتخاب دسته‌بندی</label>
                        <select id="categorySelect">
                            <option value="">انتخاب کنید</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="newCategoryInput">یا دسته‌بندی جدید</label>
                        <input type="text" id="newCategoryInput" placeholder="دسته‌بندی جدید">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">ثبت لینک</button>
            </form>
        </section>

        <!-- فیلتر و لیست لینک‌ها -->
        <section class="links-section">
            <div class="filter-bar">
                <label for="categoryFilter">فیلتر دسته‌بندی:</label>
                <select id="categoryFilter">
                    <option value="all">همه دسته‌بندی‌ها</option>
                </select>
            </div>
            <div id="linksContainer" class="links-grid">
                <!-- لینک‌ها در اینجا رندر می‌شوند -->
            </div>
        </section>
    </main>

    <script type="module" src="app.js"></script>

    <!-- ثبت سرویس ورکر برای کارکرد آفلاین -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker با موفقیت ثبت شد:', reg.scope))
                    .catch(err => console.log('خطا در ثبت Service Worker:', err));
            });
        }
    </script>
</body>
</html>
